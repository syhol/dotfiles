# Scroll, select panes and resize with the mouse.
set -g mouse on

# --- Plugins (TPM) -------------------------------------------------------------
# TPM is cloned by [bootstrap.repos] in mise.toml. Plugins live outside this
# repo, in ~/.local/share/tmux/plugins; prefix + I installs new ones, prefix + U
# updates them.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

# Popup menu of actions: prefix + Space.
set -g @plugin 'alexwforsythe/tmux-which-key'

# Install any missing plugins on a fresh machine, then load them. Keep last.
if "test ! -d ~/.local/share/tmux/plugins/tmux-which-key" \
  "run '~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'
