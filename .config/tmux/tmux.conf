# Prefix is Ctrl-a instead of Ctrl-b. Press it twice to send a literal Ctrl-a
# (start of line in the shell).
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# Scroll, select panes and resize with the mouse.
set -g mouse on

# Name the terminal tab/window after the session and window, e.g. "task-27 / claude".
set-option -g set-titles on
set-option -g set-titles-string "#S / #W / #T"

# Number windows and panes from 1, and close the gaps when a window goes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New panes open in the current pane's directory (the defaults use the
# directory tmux started in). Same keys: % side by side, " stacked.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"

# ctrl+tab / ctrl+shift+tab arrive from Ghostty as extended keys.
# always, not on: with on, tmux only turns extended keys on in Ghostty when a
# program inside the pane asks, and the shell doesn't, so C-Tab arrived as Tab.
set -s extended-keys always
set -as terminal-features 'xterm-ghostty:extkeys'
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# C-a r: reload this file in place. Restarting the server would kill every
# session (the overseer and its workers), so that stays a deliberate act.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Session/window switcher: one tree of sessions with their windows, zoomed.
# C-a w (and cmd+p in Ghostty); C-a Space too, as the easier reach.
bind w choose-tree -Zw

# Close without asking (Simon, 2026-10-13); cmd+w and cmd+shift+w in Ghostty.
bind & kill-window
bind x kill-pane
bind Space choose-tree -Zw

# Vim keys in copy mode (prefix + [), and enough history to be worth searching.
setw -g mode-keys vi
set -g history-limit 50000

# Releasing a mouse drag keeps the selection and stays put, instead of copying
# and jumping to the bottom. Copy with y or Enter.
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Vim-style selections: v starts one, C-v toggles a rectangle.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Open the pane's scrollback in a read-only nvim popup: prefix + v.
bind v run-shell '~/.local/bin/tmux-scrollback "#{pane_id}"'

# --- Plugins (TPM) -------------------------------------------------------------
# TPM is cloned by [bootstrap.repos] in mise.toml. Plugins live outside this
# repo, in ~/.local/share/tmux/plugins; prefix + I installs new ones, prefix + U
# updates them.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

set -g @plugin 'catppuccin/tmux#v2.3.1'

set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"

# Install any missing plugins on a fresh machine, then load them. Keep last.
if "test ! -d ~/.local/share/tmux/plugins/tmux" \
  "run '~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'

# Status bar as in catppuccin's screenshots: nothing on the left (tmux's default
# is "[session]"), and only catppuccin's session module on the right (instead
# of tmux's default pane title, time and date). Add more modules with
# `set -ag status-right "#{E:@catppuccin_status_<module>}"`.
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}"
