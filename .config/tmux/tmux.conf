# Prefix is Ctrl-a instead of Ctrl-b. Press it twice to send a literal Ctrl-a
# (start of line in the shell).
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# Scroll, select panes and resize with the mouse.
set -g mouse on

# Name the terminal tab/window after the session and window, e.g. "task-27 / claude".
set-option -g set-titles on
set-option -g set-titles-string "#S / #W / #T"

set -g base-index 1

set -g default-terminal "tmux-256color"

# Vim keys in copy mode (prefix + [), and enough history to be worth searching.
setw -g mode-keys vi
set -g history-limit 50000

# Open the pane's scrollback in a read-only nvim popup: prefix + v.
bind v run-shell '~/.local/bin/tmux-scrollback "#{pane_id}"'

# --- Plugins (TPM) -------------------------------------------------------------
# TPM is cloned by [bootstrap.repos] in mise.toml. Plugins live outside this
# repo, in ~/.local/share/tmux/plugins; prefix + I installs new ones, prefix + U
# updates them.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

# Fuzzy menu of sessions, windows, panes, commands and key bindings: prefix + F.
# Its `menu` entry holds the actions below.
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_MENU="scrollback in nvim\n~/.local/bin/tmux-scrollback\n"
set -g @plugin 'catppuccin/tmux#v2.3.1'
# Session picker with previews, which can also start a session from a directory
# (zoxide): prefix + s, replacing the default picker. Panes are in tmux-fzf.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-zoxide-mode 'on'

set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"

# Install any missing plugins on a fresh machine, then load them. Keep last.
if "test ! -d ~/.local/share/tmux/plugins/tmux-fzf" \
  "run '~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'
